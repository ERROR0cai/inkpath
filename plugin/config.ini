; Inkpath 图像转笔迹插件配置（参数逐项说明版）
; 本文件仅更新注释，所有 [节名]、键名、数值及排列顺序均与上传版完全一致。
; 参数更改请修改 Xournal++ 安装目录中本文件；通常下一次导入图片时重新读取。
; 单位约定：像素指 image.max_side 缩放后的处理图像像素；路径点数不等于物理长度。
; 处理链：图像归一化 → [perspective](可选) → [threshold] → [repair](旧轮廓模式才启用)
;         → [skeleton]/ZHANG_SUEN → [denoise] → [reconstruction] → [output]。
; 重要关系一：GRAPH 模式跳过旧 repair 闭运算；CONTOUR 模式不执行图重建。
; 重要关系二：denoise 有效锚点下限 = max(anchor_min_pixels, 当前模式最大候选像素数+1)。
; 重要关系三：GRAPH 的断口允许距离同时受 max_gap、方向条件和 character_guard 约束。
; 重要关系四：所有参数无论当前模式是否使用，读取 INI 时仍须满足单项合法范围。

[output]
; 含义：所有输出路径的 x、y 坐标乘此倍数；只改变 Xournal++ 页面上的尺寸，不改变像素分析。
; 效果：增大则笔迹更大，减小则更小；需与 image.max_side 联合考虑最终页面占用。
; 关系：偏移 offset_x/offset_y 是缩放后的附加量；不参与修复距离、密度或去噪判定。范围 (0,10]。
scale = 0.5

; 含义：已缩放的全部笔迹在页面坐标中水平平移；正数右移、负数左移。
; 效果：影响导入位置，不影响识别、断口连接、去噪及路径数量。
; 关系：位置计算为 x_page = x_pixel * output.scale + output.offset_x；范围 [-10000,10000]。
offset_x = 15

; 含义：已缩放的全部笔迹在页面坐标中竖直平移；正数下移、负数上移。
; 效果：影响导入位置，不改变笔画形状和修复决策。
; 关系：y_page = y_pixel * output.scale + output.offset_y；范围 [-10000,10000]。
offset_y = 15

; 含义：Lua 导入端要求单条最终路径至少有多少个坐标点（含首末点）。
; 效果：增大可减少短碎笔迹，但可能滤掉小符号；它不是实际物理长度。
; 关系：GRAPH 模式还先经过 reconstruction.min_points；最终要求同时通过两处，等效点数门槛为 max(本值, reconstruction.min_points)。CONTOUR 模式只受本项控制。整数范围 [2,10000]。
min_stroke_points = 2

; 含义：1 导入当前页之后的下一页（必要时创建）；0 导入当前页。
; 效果：只改变目标页，不改变路径生成和识别质量。
; 关系：无其它数值约束；仅允许 0 或 1。
next_page = 1

[image]
; 含义：图像最长边超过此值时等比缩小至此像素数；较小图片不会被放大。
; 效果：增大通常保留更多笔画细节但提高耗时/内存；减小可能让小字断裂或消失。
; 关系：所有以处理后像素为单位的 repair、denoise、reconstruction 距离/窗口都在缩放后的坐标系内工作；还与 output.scale 共同影响导入尺寸。整数范围 [128,16384]。
max_side = 2600

; 含义：0 自动判断黑白极性；1 强制白底黑字；2 强制黑底白字并先反色。
; 效果：选错极性可能导致整片背景被当笔迹；不是大小连续变化参数。
; 关系：仅设为 0 时 image.bright_ratio 生效；从插件强制模式菜单导入时，菜单选择可覆盖此值；取值 0/1/2。
polarity_mode = 0

; 含义：自动极性模式下，亮色像素所占比例的判别分界。
; 效果：增大更容易触发反色；减小更倾向于保留原极性。
; 关系：仅 image.polarity_mode=0 且未通过强制菜单指定模式时有效。范围 [0,1]。
bright_ratio = 0.5

[perspective]
; 含义：原图较短边的最小像素门槛；短边小于本值时跳过透视校正。
; 效果：增大则更多小图直接跳过；减小则更多图尝试矫正。
; 关系：仅 perspective.passes>0 时影响处理结果；还与 max_aspect_ratio 共同决定是否跳过。整数范围 [1,8192]。
min_short_side = 250

; 含义：长边/短边的最大允许比值；超出时视为长条图并跳过透视校正。
; 效果：增大使长条图片更可能进行校正；减小使更多图片跳过。
; 关系：仅 perspective.passes>0 时有效；需同时通过 min_short_side 门槛。范围 [1,100]。
max_aspect_ratio = 4.0

; 含义：透视寻找与校正最多执行几次；0 完全跳过，1 一次，2 最多两次。
; 效果：增加可能纠正歪斜，也可能因误检而裁切、扭曲；0 时不会运行透视识别。
; 关系：本值为 0 时本节其它透视参数均不影响输出，但仍会被配置解析器检查合法性。整数范围 [0,2]。
passes = 0

; 含义：候选四边形面积与整图面积之比的下限。
; 效果：增大排除较小候选；减小更容易选中画面里的小框。
; 关系：必须严格小于 perspective.max_area_ratio；仅 passes>0 时参与实际校正。范围 [0,1]。
min_area_ratio = 0.25

; 含义：候选四边形面积与整图面积之比的上限。
; 效果：增大允许接近满幅的候选；减小会排除较大目标。
; 关系：必须严格大于 perspective.min_area_ratio；仅 passes>0 时参与实际校正。范围 [0,1]。
max_area_ratio = 0.90

; 含义：四边形搜索前加到图像四周的边框宽度，单位像素。
; 效果：改变贴边轮廓与背景的检测结果；并非最终笔画宽度。
; 关系：仅 passes>0 时影响校正，范围 [0,100]；会与 median_kernel 和 Canny 阈值一起影响轮廓。
border_width = 10

; 含义：寻找四边形边界前的中值滤波方窗边长。
; 效果：增大通常压制孤立边界噪声，但可能模糊细小真实边缘。
; 关系：与 canny_low/high、threshold_levels 共同影响透视检测，不参与 [threshold] 最终文字二值化；仅 passes>0 生效。须为 [3,31] 的奇数。
median_kernel = 9

; 含义：透视边缘检测的 Canny 较低阈值。
; 效果：增大通常减少弱边缘，减小更敏感但误检可能增多。
; 关系：必须小于或等于 canny_high；仅 passes>0 时影响输出。范围 [0,1000]。
canny_low = 10

; 含义：透视边缘检测的 Canny 较高阈值。
; 效果：增大要求更强边缘，减小放宽检测。
; 关系：必须大于或等于 canny_low；仅 passes>0 时影响输出。范围 [0,1000]。
canny_high = 20

; 含义：Canny 梯度 Sobel 算子孔径大小。
; 效果：改变边缘梯度响应，不是笔迹平滑参数。
; 关系：实际 OpenCV Canny 支持的通常为 3/5/7；仅 passes>0 时影响图像。
canny_aperture = 3

; 含义：将检测到的轮廓近似成多边形时，最大偏差占轮廓弧长的比例。
; 效果：增大近似更粗，减小保留更多轮廓细节；会影响是否恰好得到四角候选。
; 关系：只属于透视检测，不等于 [contours] 的笔迹坐标近似；仅 passes>0 时实际生效。范围 [0.0001,0.5]。
approx_epsilon = 0.02

; 含义：四边形搜索初始轮廓允许的最小面积，单位平方像素。
; 效果：增大排除小候选，减小增多小轮廓。
; 关系：与 min_area_ratio/max_area_ratio 是不同阶段的面积筛选；仅 passes>0 生效。范围 [0,1e8]。
min_contour_area = 1000

; 含义：四边形候选顶点夹角余弦绝对值的容许上限；越小越接近直角。
; 效果：增大放宽角度要求，减小严格限制近直角。
; 关系：需与 approx_epsilon 配合才容易拟合出四边形；仅 passes>0 生效。范围 [0,1]。
max_angle_cosine = 0.3

; 含义：透视轮廓搜索尝试的阈值层数；首级使用 Canny，其他级使用亮度阈值。
; 效果：增大提高候选覆盖但增加计算和误选机会。
; 关系：与 canny_low/high 和 median_kernel 共同作用于四边形检测；仅 passes>0 生效。整数范围 [2,16]。
threshold_levels = 2

[threshold]
; 含义：文字二值化前的高斯模糊核边长；1 表示跳过高斯模糊。
; 效果：增大可抑制微小噪声但可能削弱细字与上标；减小更保留细节。
; 关系：先模糊，再由 block_size 和 c 进行自适应二值化；会间接影响后续细化、去噪和图重建。范围 [1,31] 的奇数。
gaussian_kernel = 5

; 含义：对每个像素计算局部阈值时使用的高斯加权正方形窗口边长。
; 效果：增大参考更大区域亮度；减小跟随局部背景但可能误判纹理。
; 关系：先受 gaussian_kernel 模糊，再使用 c 从加权平均值中扣减；须为 [3,255] 的奇数。
block_size = 11

; 含义：自适应阈值常数；逐像素阈值 = 局部高斯加权均值 - c。
; 效果：增大通常减少被判成黑色的浅笔迹和背景点；减小保留更多浅色像素，也会增加杂点。
; 关系：与 block_size 和 gaussian_kernel 联合决定骨架原始输入；可为负数，范围 [-255,255]。
c = 5

[repair]
; 含义：旧模式下是否执行二值前景的形态学闭运算，0 关闭、1 开启。
; 效果：可补微小断口，也可能将靠近的汉字/笔画粘连；不理解书写方向。
; 关系：只有 reconstruction.mode=CONTOUR 才调用；GRAPH 模式始终跳过；与 kernel_size、iterations、kernel_shape 配合。
enabled = 0

; 含义：闭运算结构元素的边长，控制膨胀/腐蚀邻域大小。
; 效果：越大越可能封闭较宽空隙，但误粘连风险增大。
; 关系：仅 mode=CONTOUR 且 repair.enabled=1 生效；与 iterations 和 kernel_shape 联合作用。须为 3/5/7 中之一。
kernel_size = 7

; 含义：OpenCV 闭运算执行所用的迭代次数。
; 效果：增大通常使连接与填补作用更强，也更可能损失原始字形。
; 关系：仅 mode=CONTOUR 且 repair.enabled=1 有效，受 kernel_size 与 kernel_shape 共同影响。整数范围 [1,3]。
iterations = 1

; 含义：闭运算结构元素形状：CROSS 十字、RECT 方形、ELLIPSE 近似椭圆。
; 效果：改变不同方向可扩张/闭合的范围；形状间不存在统一的强弱序。
; 关系：仅 mode=CONTOUR 且 repair.enabled=1 生效；实际大小由 kernel_size、iterations 决定。
kernel_shape = ELLIPSE

[skeleton]
; 含义：旧形态学骨架算法进行腐蚀、开运算时的结构元素边长。
; 效果：改变骨架位置、断裂程度与分叉形态；不是最终笔画粗细。
; 关系：mode=CONTOUR，或 mode=GRAPH 且 thinning=MORPH 时使用；thinning=ZHANG_SUEN 时无效。须为 [3,15] 奇数。
kernel_size = 3

; 含义：旧形态学骨架的结构元素形状：CROSS、RECT 或 ELLIPSE。
; 效果：不同形状对拐角与斜线的影响不同，不能保证某种总更好。
; 关系：作用条件与 skeleton.kernel_size 相同；GRAPH + ZHANG_SUEN 时不参与。
kernel_shape = CROSS

[contours]
; 含义：旧 findContours 轮廓层级策略：RETR_LIST 全部、RETR_EXTERNAL 仅外部、RETR_TREE 全树、RETR_CCOMP 两层。
; 效果：会影响输出哪些轮廓、是否包含内孔边界；不能按名称解释为汉字笔画。
; 关系：仅 reconstruction.mode=CONTOUR 有效，GRAPH 模式不使用 findContours 生成笔迹。
retrieval_mode = RETR_LIST

; 含义：旧轮廓坐标存储方式：CHAIN_APPROX_NONE 尽量保留所有边界点；CHAIN_APPROX_SIMPLE 压缩直线冗余点。
; 效果：简化方式可减少坐标点，但可能改变 output.min_stroke_points 过滤结果。
; 关系：仅 mode=CONTOUR 有效；不控制 GRAPH 中心线重建的平滑度。
approximation_mode = CHAIN_APPROX_NONE


[diagnostics]
; 含义：0 不生成诊断图、1 在每次导入时写出中间处理图片并显示统计。
; 效果：便于区分二值化、骨架、去噪、图重建哪个步骤产生问题；增加写盘时间但不改算法判定。
; 关系：GRAPH 时另输出 06_graph_added_mask.png 与 07_reconstructed.png；诊断图保存在系统 TEMP/InkpathDiagnostics 并可能被下次覆盖。
enabled = 0


[denoise]
; 含义：是否在骨架产生之后、笔迹提取之前执行按连通域大小及邻近锚点的去噪。
; 效果：0 完全跳过，1 允许删除独立小连通域；过强可能误删小数点。
; 关系：关闭时本节其余参数不影响像素输出；GRAPH、CONTOUR 都会经过此阶段。
enabled = 1

; 含义：正常区域最多考虑删除多少个黑色骨架像素构成的连通域。
; 效果：增大清除更大的孤立碎片，也可能误删独立短笔。
; 关系：density_enabled=0 时所有区域只用本上限；density_enabled=1 时稀疏区域可用 sparse_max_pixels，并要求后者 >= 本值；当前值 10。范围 [0,10000]。
max_component_pixels = 10

; 含义：候选小连通域距离任一有效锚点像素不超过此半径时被保护，单位处理后像素。
; 效果：增大保护更多字符附近的小点，背景噪声也可能残留；减小清除更激进。
; 关系：锚点资格取决于 anchor_min_pixels 和候选上限；即使 density_enabled=1，距离保护仍优先于稀疏删除。范围 [0,500]。
neighbor_radius = 40

; 含义：允许作为大笔迹保护锚点的连通域大小下限。
; 效果：增大使较少笔迹能保护小点；减小则保护更广。
; 关系：实际锚点下限 = max(anchor_min_pixels, activeCandidateCap+1)；activeCandidateCap 在 density_enabled=0 时为 max_component_pixels，开启时为 sparse_max_pixels。当前密度开启，故 max(15,17+1)=18，而非 15。范围 [1,100000]。
anchor_min_pixels = 15

; 含义：0 仅使用保守去噪；1 根据锚点的局部像素密度在普通/稀疏上限之间选择。
; 效果：开启后低密度区域可能删除尺寸更大的噪点，但不会绕过邻近锚点保护。
; 关系：0 时 density_window、low_density_threshold、sparse_max_pixels 不参与去噪计算，且不要求稀疏上限 >= 普通上限；1 时必须满足此不等式。
density_enabled = 1

; 含义：计算局部锚点像素密度的正方形窗口边长，以处理后像素计。
; 效果：增大参考区域扩大，可能稀释局部密度；减小响应更局部，不保证总会改变最终删除结果。
; 关系：仅 denoise.enabled=1 且 density_enabled=1 生效；密度与 low_density_threshold 比较，并只计锚点像素。须为 [3,501] 奇数。
density_window = 65

; 含义：局部锚点像素比例低于本值时才判为稀疏；0.01 表示 1%。
; 效果：增大使更多候选区域获得稀疏上限；减小更难触发。
; 关系：仅 density_enabled=1 生效；当前 density_window=65 时窗口面积=4225；密度按候选连通域上的最大局部值比较，小于阈值才算稀疏。范围 [0,1]。
low_density_threshold = 0.01

; 含义：密度自适应判断为稀疏区域时，可删除候选连通域的最大骨架像素数。
; 效果：增大使稀疏区去噪增强，但误删短小数学符号风险增加。
; 关系：仅 density_enabled=1 时需 >= max_component_pixels，否则配置报错；还会影响有效锚点下限 max(anchor_min_pixels,sparse_max_pixels+1)。关闭密度时完全不影响去噪结果。范围 [0,10000]。
sparse_max_pixels = 17


[reconstruction]
; 含义：GRAPH 用骨架图构建独立中心线路径；CONTOUR 用原有轮廓提取。
; 效果：GRAPH 更适合独立编辑交叉与折角笔画，但不是 OCR 或真实笔顺恢复；CONTOUR 用于回退和对比。
; 关系：GRAPH 跳过旧 repair 闭运算，使用 gap/junction 参数；CONTOUR 使用 [repair]、[contours]，且 [reconstruction] 的图参数不参与笔迹生成。
mode = GRAPH
; 含义：GRAPH 模式的骨架细化方式：ZHANG_SUEN 迭代细化；MORPH 旧形态学骨架。
; 效果：ZHANG_SUEN 尽量保留图像拓扑，MORPH 可能生成较多碎片；实际效果受二值化影响。
; 关系：仅 mode=GRAPH 生效；选择 MORPH 时 [skeleton] 核参数有效；选择 ZHANG_SUEN 时忽略 [skeleton] 核参数。
thinning = ZHANG_SUEN
; 含义：GRAPH 模式下是否尝试连接不相接的两条中心线路径端点，0 禁止、1 允许候选匹配。
; 效果：开启可能修复断笔，也可能连接相邻字符；关闭仍可使用 junction_pairing 对已有交点分笔。
; 关系：关闭时 max_gap、smooth_angle、corner_enabled、corner_max_gap、corner_angle、character_guard、max_gap_ratio 不参与断口匹配；direction_window 仍可供交点配对。
gap_enabled = 1
; 含义：允许自动跨越的断口端点欧氏距离上限，单位处理后像素。
; 效果：增大允许检查更远端点，误连风险也上升；0 等效不进行断口修复。
; 关系：仅 GRAPH 且 gap_enabled=1 有效；折角分支还需满足 corner_max_gap；若 character_guard=1，还必须同时满足 max_gap_ratio*局部尺度。整数范围 [0,50]，例如 71 会配置报错。
max_gap = 7
; 含义：从路径端点沿线向内数的参考点数，用该端点与参考点形成方向向量。
; 效果：增大方向更偏向较长路径整体趋势；减小更敏感于端点曲折和像素抖动。
; 关系：有效参考跨度 k=min(direction_window,路径点数-1)；影响 junction_pairing 与 gap_enabled 的方向检测。整数范围 [2,40]。
direction_window = 6
; 含义：平滑断口连接中，端点向外方向与通往另一端点方向的最大偏差角（度）。
; 效果：增大允许更多弯折相接，误连机会也上升；减小更倾向直线延续。
; 关系：仅 GRAPH 且 gap_enabled=1 有效；程序要求两端偏差的最大值 <= 本值；折角候选可经 corner_enabled 使用 corner_angle 替代。范围 [0,180]。
smooth_angle = 40
; 含义：允许在较短断口处使用比平滑连接更宽松的折角判断。
; 效果：可能修复 Z 等折笔断裂，但若设置宽松也会误连附近短线。
; 关系：仅 GRAPH 且 gap_enabled=1 生效；候选必须满足 d<=corner_max_gap 以及端点偏差<=corner_angle；仍受 max_gap 和 character_guard 约束。
corner_enabled = 1
; 含义：折角候选端点之间允许的最大距离，单位处理后像素。
; 效果：增大折角修复范围，但连接不相干笔画风险升高。
; 关系：只有 corner_enabled=1 且 gap_enabled=1 时生效；折角实际距离必须 <= min(max_gap,corner_max_gap)，无配置强制要求本值小于 max_gap。整数范围 [0,50]。
corner_max_gap = 3
; 含义：折角候选两端朝向连接线的偏差中较大者所允许的上限角度。
; 效果：增大容许更急的转折，减小则更严格；它不是字母 Z 转角本身的直接测量。
; 关系：仅 corner_enabled=1 且 gap_enabled=1 生效；满足 smooth_angle 的候选本来就可走平滑分支，折角额外受 corner_max_gap 限制。范围 [0,180]。
corner_angle = 105
; 含义：已相接的骨架分叉节点处，是否将几何方向连续的两条分支配对成一条独立可编辑路径。
; 效果：可使 X 等交叉结构少碎裂，不保证恢复真实书写笔顺；0 则通常保留更多分段。
; 关系：只在 GRAPH 模式有效，与 gap_enabled 相互独立；方向判断使用 direction_window 和 junction_angle。
junction_pairing = 1
; 含义：已有交点处两分支配对允许的最大偏离直线角度。
; 效果：减小只配很直的两分支；增大可能把转折较大的分支接起来。
; 关系：仅 GRAPH 且 junction_pairing=1 有效；代码计算偏差 delta=180°-两条向外交点切线夹角，要求 delta<=本值。范围 [0,90]。
junction_angle = 40
; 含义：GRAPH 阶段允许输出的独立中心线至少含多少个坐标点。
; 效果：增大过滤短碎片，也可能删掉有意义的小符号。
; 关系：仅 GRAPH 有效；其后 Lua 还检查 output.min_stroke_points，因此最终最低要求等效为两者的 max。整数范围 [2,1000]。
min_points = 2
; 含义：启用/关闭候选断口距离相对于线段局部尺寸的比例限制；并不执行 OCR 字符识别。
; 效果：开启减少某些跨字符远距离误连；关闭仅靠绝对距离/角度，误连概率可能上升。
; 关系：仅 GRAPH 且 gap_enabled=1 生效；启用时需满足 d<=max_gap_ratio*L，并同时满足 max_gap；L=max(4,min(两条路径包围盒对角线长))。
character_guard = 1
; 含义：当 character_guard=1 时，断口距离相对于两条候选路径较小几何尺度的允许比例。
; 效果：增大放宽局部尺度限制、更多短路径可连接；减小减少误连但可能漏修小笔画。
; 关系：L=max(4,min(L1,L2))，Li 为路径包围盒对角线长度；需 d<=min(max_gap,max_gap_ratio*L)，还须满足方向/转角约束。仅 GRAPH、gap_enabled=1、character_guard=1 生效。范围 [0.01,3]。
max_gap_ratio = 0.5


[edge_lines]
; 含义：是否启用近共线笔迹自动清理。0=关闭，1=开启。
; 效果：开启后，删除满足连续子组条件的多条近共线笔迹，或满足单线长度条件的独立长直线；关闭时不执行此项清理。
; 关系：仅开启时本节其他参数才会影响输出；该模块在笔迹重建后执行，不改变 [denoise] 和 [reconstruction] 的处理规则。仅允许 0 或 1。
; 注意：建议初次开启时同时设置 diagnostics.enabled=1，通过 08_edge_lines_removed.png 检查是否误删正常笔迹。
enabled = 0

; 含义：允许清理的图像边缘区域宽度，单位为处理后图像像素。
; 效果：0 表示全图检测；正数表示仅检测距离上、下、左、右任意图像边界不超过此距离的候选笔迹。
; 关系：候选路径上的所有坐标点都必须位于边缘区域内，才允许进入后续检测；同时约束多段共线清理与单条长直线清理，不受 output.scale 影响，但受 image.max_side 缩放影响。
; 注意：增大则检测范围扩大，可能清除更多干扰线段，但误删正文的风险也随之增加；0 表示取消边缘位置限制，而不是关闭功能。
edge_margin = 80

; 含义：一个近共线连续子组至少需要包含的独立线段数量。
; 效果：增大则要求更多线段共同组成直线结构，可减少误删少量正常笔迹的情况，但可能漏掉断裂段数较少的黑板边缘；减小则更容易清理较少段数的断续直线。
; 关系：多段子组必须同时满足 min_segments、min_total_length、min_span 及方向、偏移等约束才会被删除；单条长直线由 single_enabled 和 single_min_length 独立控制，不受本参数限制。
; 注意：统计的是笔迹重建后的独立路径数量，而不是某条路径包含的坐标点数；本参数至少为 2。
min_segments = 3

; 含义：是否允许单独删除足够长且近似笔直的独立笔迹。0=关闭，1=开启。
; 效果：开启后，即使某条直线无法与其他线段组成连续子组，只要自身长度超过 single_min_length 且满足其他筛选条件，仍可独立删除；关闭则只进行多段共线清理。
; 关系：仅 edge_lines.enabled=1 时生效；单条清理不受 min_segments、min_total_length、min_span 和 max_gap 限制，但仍受 edge_margin、max_deviation 和 min_segment_points 等条件约束。
; 注意：开启后可能删除单条较长的分数线、坐标轴或表格边框；建议结合 edge_margin 限制处理区域。
single_enabled = 1

; 含义：允许独立删除的单条直线最低折线弧长，单位为处理后图像像素。
; 效果：单条候选路径的累计弧长必须严格大于本值才会被删除；增大则更倾向于保留正常长线条，减小则可以清理较短的完整黑板边框。
; 关系：仅 single_enabled=1 且 edge_lines.enabled=1 时生效；独立于 min_total_length 和 min_span，不改变多段连续子组的删除条件。
; 注意：长度按路径中相邻坐标点之间的距离累计计算，不是简单的水平宽度、竖直高度或首末端点距离；即使长度达标，仍须满足直线程度及边缘位置条件。
single_min_length = 300

; 含义：一个近共线连续子组中所有独立线段折线弧长之和的最低要求，单位为处理后图像像素。
; 效果：增大则仅删除累计长度较大的断续直线，降低误删短横线和小型符号的风险；减小则允许清理较短的断续黑板边缘。
; 关系：仅用于多段连续子组判断，必须同时满足 min_segments 和 min_span；不影响由 single_min_length 控制的单条长直线清理。
; 注意：累计长度只包含各条线段自身的实际路径长度，不计入不同线段之间的空白断口；因此多条较短线段也可以通过累加达到本值。
min_total_length = 180

; 含义：一个近共线连续子组沿共同直线方向的首尾覆盖跨度下限，单位为处理后图像像素。
; 效果：增大则要求整组线段延伸得更远，更倾向于清除较长的黑板边缘；减小则允许清理局部范围内的断续直线。
; 关系：与 min_total_length 是两个独立且必须同时满足的条件；前者衡量整组的空间覆盖范围，后者衡量线段自身的累计长度。仅用于多段子组，不影响单条长直线清理。
; 注意：跨度包含线段之间可能存在的空白区域，因此不一定等于累计弧长；不能仅凭跨度较大就认定整组满足删除条件。
min_span = 180

; 含义：相邻候选线段沿共同直线方向允许的最大投影空白距离，单位为处理后图像像素。
; 效果：增大则允许间隔较远的近共线线段组成连续子组，适合断裂严重的黑板边缘，但可能将无关笔迹归入候选；减小则要求线段之间排列得更加紧密。
; 关系：候选线段先依据方向和位置约束进行筛选，再沿共同轴线排序，并根据本参数划分连续子组；每个子组独立验证 min_segments、min_total_length 和 min_span。与 reconstruction.max_gap 相互独立，不参与实际断笔连接。
; 注意：该参数只控制多段线段的连续分组，不会补画线段之间的空白，也不影响 single_enabled 控制的单条长直线清理。
max_gap = 22

; 含义：候选线段端点相对于共同直线允许的最大垂直偏移，单位为处理后图像像素。
; 效果：增大则允许略有错位的线段参与同一共线候选组，适合边缘不够平整的照片，但可能将附近的正常笔画错误归组；减小则要求不同线段更严格地位于同一直线附近。
; 关系：与 max_angle 共同约束多段线段之间的几何一致性；max_angle 控制方向偏差，本参数控制相对共同轴线的位置偏差。与单条路径内部的 max_deviation 不同。
; 注意：方向相同并不代表共线，例如两条距离较远的平行线仍应被本参数排除；本参数不是线段之间的断口距离。
max_offset = 3

; 含义：不同候选线段相对于共同直线方向允许的最大夹角偏差，单位为度，比较时忽略方向正反。
; 效果：增大则允许存在一定倾斜差异的线段参与共线分组，适合不够规则的黑板边缘，但可能误将不同方向的正常笔画归组；减小则要求各段方向更加一致。
; 关系：与 max_offset、max_deviation 分别负责不同层面的筛选；本参数约束不同线段之间的方向一致性，max_offset 约束共同直线附近的位置关系，max_deviation 约束单条线段自身是否足够笔直。
; 注意：即使两段线的方向夹角非常小，如果它们不靠近同一条直线，仍不能仅凭本参数归为一组；允许范围为 0～45 度。
max_angle = 8

; 含义：单条候选路径中任意坐标点偏离其首末端点连线的最大允许距离，单位为处理后图像像素。
; 效果：增大则允许略有弯曲或像素抖动的线段参与检测，但也可能将弧线、折线误判为直线；减小则更严格地排除非直线笔迹。
; 关系：同时影响多段共线候选筛选和单条长直线清理；与 max_offset 不同，本参数只判断单条路径自身的直线程度，不判断不同路径是否靠近同一共同直线。
; 注意：路径长度较大并不意味着一定足够笔直；只要某个坐标点偏离首末端点连线过大，该路径就可能无法参与清理。
max_deviation = 2.5

; 含义：单条候选路径参与近共线检测或长直线清理所需的最少坐标点数量。
; 效果：增大则排除更多由少量坐标点组成的短碎片，减少噪点误参与检测，但可能漏掉点数较少、实际长度却较大的线段；减小则允许更多短路径参与。
; 关系：与 reconstruction.min_points、output.min_stroke_points 不同；前者影响图重建阶段保留哪些路径，后者影响哪些路径最终导入 Xournal++，本参数只决定现有路径是否有资格进入边缘直线清理。
; 注意：坐标点数不等于实际几何长度；一条路径即使满足本参数，也仍须通过对应的长度、位置及直线程度等检查。
min_segment_points = 3
