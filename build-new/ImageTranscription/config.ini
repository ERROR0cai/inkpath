; 图像转笔迹插件配置文件
; 保留原参数的名称与数值，并增加独立的后处理去噪模块。
; 修改已安装插件目录中的本文件并保存后，下一次导入图片时读取新参数，无需重新编译。
; 仅修改源码目录中的副本，不会自动更新已安装插件的配置。
; 如果文件或某项配置缺失，插件使用代码中预设的默认值。
; 请勿把本文件与负责插件加载的 插件入口文件混淆。
; 参数的实际效果会受到原图分辨率、对比度和其他参数影响；下面的说明表示通常的变化趋势。

[output]
; 最终笔迹坐标的缩放倍数；只改变生成笔迹的尺寸，不直接改善识别质量。
; 增大：笔迹在页面上更大、更容易超出页面；减小：笔迹更小。
scale = 0.5

; 笔迹相对目标页原点向右平移的距离，单位为 笔记软件的页面坐标单位。
; 增大：向右移动；减小：向左移动；负值可使笔迹越过页面左边界。
offset_x = 15

; 笔迹相对目标页原点向下平移的距离，单位为 笔记软件的页面坐标单位。
; 增大：向下移动；减小：向上移动；负值可使笔迹越过页面上边界。
offset_y = 15

; 一条轮廓至少需要包含多少个坐标点才会被导入。
; 增大：过滤更多短小轮廓和噪点，但也可能丢失小数点、短横线等细节。
; 减小：保留更多微小笔画，也可能引入更多杂点；最小有效值为 2。
min_stroke_points = 2

; 导入笔迹的页面位置：1 表示放到下一页（不存在时新建）；0 表示放到当前页。
; 这是开关参数，不能当连续数值增减；切换为 0 后不会自动转到下一页。
next_page = 1

[image]
; 输入图片允许保留的最长边像素数；超出时按比例缩小，未超出则保持原尺寸。
; 增大：保留更多细节，但耗时和内存占用可能升高，输出笔迹也可能变大。
; 减小：运行负担较低，但细线可能丢失，输出笔迹坐标范围也可能缩小。
max_side = 2600

; 背景模式：0 自动判断；1 强制认为原图白底黑字；2 强制认为原图黑底白字并反色。
; 这是模式选择，不存在越大越好的关系；插件中的两个强制菜单可覆盖此默认值。
polarity_mode = 0

; 自动模式下的亮色像素比例分界线：实际亮色占比小于本值时执行黑白反转。
; 增大：更容易判为黑底白字并反色；减小：更倾向于保持原图不反色。
; 仅影响自动模式，不影响手动强制指定背景的模式。
bright_ratio = 0.5

[perspective]
; 图片短边低于此像素数时跳过透视校正，防止小截图被错误裁剪或拉斜。
; 增大：更多图片跳过透视校正；减小：更多小图会尝试进行透视校正。
min_short_side = 250

; 图片长边与短边的比值超过本值时跳过透视校正。
; 增大：长条图片更不容易跳过校正；减小：更多偏长的图片跳过校正。
max_aspect_ratio = 4.0

; 透视校正执行次数：0 不校正；1 执行一次；2 最多连续执行两次。
; 增大：可能进一步校正拍照歪斜，但误识别时也更容易引入倾斜与裁切。
; 减小：减少透视变换及相关风险，但真实拍摄的歪斜可能无法充分校正。
passes = 0

; 候选四边形面积占整张图片面积的最小比例。
; 增大：更严格排除小矩形，可能漏掉画面中较小的纸张或白板。
; 减小：允许更多小区域参与检测，也更可能把表格、文字框当成白板。
min_area_ratio = 0.25

; 候选四边形面积占整张图片面积的最大比例。
; 增大：允许接近铺满画面的纸张参与检测，也可能增加边界误判。
; 减小：更容易排除过大的候选区域，但可能漏掉贴近图像边缘的纸张。
max_area_ratio = 0.90

; 检测四边形前在图像四周添加的黑色边框宽度，单位为像素。
; 增大：边缘区域与黑色边框的间距增大，可能改变轮廓检测结果。
; 减小：边框影响降低，但贴近图片边缘的轮廓可能更难完整识别。
border_width = 10

; 四边形检测阶段的中值滤波窗口边长，仅影响找纸张边缘，不直接处理最终笔迹。
; 增大：更强地压制孤立噪点，也可能抹去弱边界；减小：保留更多边缘细节和噪点。
; 必须为不小于 3 的奇数。
median_kernel = 9

; 四边形检测所用的边缘提取低阈值。
; 增大：较弱的边缘更容易被舍弃，噪点边缘减少；减小：更敏感，也更容易发现噪点。
; 通常应不大于高阈值。
canny_low = 10

; 四边形检测所用的边缘提取高阈值。
; 增大：强边缘判定更严格，可能漏掉低对比度纸张边缘。
; 减小：更多边缘可参与连接，也可能增加错误候选轮廓。
canny_high = 20

; 边缘提取运算时所用的梯度算子尺寸，可选择 3、5、7。
; 增大：采用更大的邻域计算梯度，边缘响应形态会变化，不保证一定更干净。
; 减小：更注重局部细节，也可能更容易受到像素噪声影响。
canny_aperture = 3

; 四边形轮廓近似误差相对于轮廓周长的比例。
; 增大：轮廓简化更强，更容易丢失细节；减小：拟合更严格，可能保留过多顶点。
; 此参数影响是否能将候选轮廓近似为四边形，不控制笔迹平滑度。
approx_epsilon = 0.02

; 候选四边形允许的最小轮廓面积，单位为平方像素。
; 增大：排除更多小轮廓，降低误检，但较小的纸张区域可能被过滤。
; 减小：容纳更多小四边形，也可能增加表格或文字框误判。
min_contour_area = 1000

; 四边形角度与直角的偏离容许值，以相邻边夹角余弦的绝对值判断。
; 增大：更宽松，容许更斜的候选四边形，也更容易误识别。
; 减小：更严格，要求边之间更接近垂直，可能漏掉透视明显的纸张。
max_angle_cosine = 0.3

; 在四边形搜索中采用的阈值层级数量。
; 增大：尝试更多亮度阈值，可能找到更多候选轮廓，但计算量和误检机会增加。
; 减小：搜索更少，通常更快，但可能漏掉某些纸张边缘。
threshold_levels = 2

[threshold]
; 正式提取笔画前的高斯模糊窗口边长。
; 增大：噪点通常减少，但细笔画、撇号、小数点可能变淡或断裂。
; 减小：保留更多细节，但噪点也可能增多；取 1 表示不进行有效模糊。
; 必须为正奇数。
gaussian_kernel = 5

; 自适应二值化时每个像素参考的局部窗口边长。
; 增大：参考更大范围的亮度，对局部微小变化不那么敏感，但可能不适合快速变化的背景。
; 减小：更贴近局部亮度，可能保留小字细节，也可能把纸张纹理识别成笔迹。
; 必须为不小于 3 的奇数。
block_size = 11

; 自适应二值化常数：实际阈值为局部加权平均亮度减去本值。
; 增大：更容易把较浅区域判成白色，背景噪点可能减少，但淡笔迹易消失。
; 减小：更容易把较浅区域判成黑色，淡笔迹可能保留得更多，但噪点可能增多。
c = 5

[repair]
; 旧闭运算仅在 reconstruction.mode = CONTOUR 时应用；GRAPH 模式自动跳过。
; 是否在骨架提取前尝试连接二值图中距离很近的断口。0：关闭，1：开启。
; 开启后可连接约一两个像素的断裂，也可能错误地连接相邻的笔画或字符。
enabled = 1

; 连接断口使用的邻域边长，必须是 3、5 或 7。
; 增大：可连接更宽的缺口，但更容易粘连相邻字符；减小：连接更保守。
kernel_size = 7

; 闭运算执行次数，允许 1 至 3。
; 增大：连接作用更强、笔画可能变粗或粘连；减小：保留原有字形更好。
iterations = 1

; 邻域形状：ELLIPSE 为近似圆形，CROSS 为十字形，RECT 为方形。
; RECT 连接作用通常更强，CROSS 比较保守，ELLIPSE 适合作为首次测试。
kernel_shape = ELLIPSE

[skeleton]
; 形态学骨架提取所用的结构元素尺寸。
; 增大：腐蚀和膨胀的作用范围改变，可能使细笔画更快消失或骨架明显变形。
; 减小：作用更局部，可能保留更多细节，但骨架噪点和形态也会变化。
; 必须为不小于 3 的奇数。
kernel_size = 3

; 骨架提取使用的结构元素形状：十字形、矩形、椭圆形。
; 此项不是数值大小关系；不同形状会改变腐蚀方向和骨架分叉形态。
; 当前十字形为原始设置，建议没有充分测试时不要随意改变。
kernel_shape = CROSS

[contours]
; 轮廓检索方式：完整列表模式记录所有轮廓；最外层模式仅提取外部轮廓。
; 树状模式保留完整轮廓层级；两级模式建立两级轮廓层级。
; 此项不是递增参数；改为仅提取外轮廓可能遗漏文字内部或其他独立轮廓。
retrieval_mode = RETR_LIST

; 轮廓坐标近似方式：完整模式尽量保存所有轮廓点；
; 简化模式压缩水平、垂直和对角直线段上的冗余点。
; 使用简化方式通常能减少点数，但会改变笔迹坐标序列；这不是识别精度的简单增减。
approximation_mode = CHAIN_APPROX_NONE


[diagnostics]
; 是否生成图像处理过程的三张诊断图并在每次导入时显示变化像素数量。
; 0：关闭，正常使用时建议关闭；1：开启并弹出诊断结果。
; 图片输出至系统临时目录的 InkpathDiagnostics 文件夹，重复导入会覆盖上次三张图片。
; 开启会增加磁盘写入与处理时间，不改变图像处理算法和笔迹结果。
enabled = 0


[denoise]
; 是否开启骨架后的保守连通域去噪。0 关闭；1 开启。
; 开启后只处理小且远离较大笔迹的连通域，不改变断笔连接与骨架算法。
enabled = 1

; 保守模式候选连通域最多包含多少个黑色像素。
; 增大：清除较大噪点，但可能误删独立小符号；减小：保留更多细节。
max_component_pixels = 10

; 小连通域距离较大有效笔迹不超过本半径时予以保护，单位为处理后像素。
; 增大：更多小符号受到保护，去噪更温和；减小：删除范围扩大。
neighbor_radius = 40

; 基准大笔迹的最小像素数，实际保护锚点阈值不小于 sparse_max_pixels + 1。
; 增大：较少区域可作为邻近保护基准，可能增加误删；减小：保护更宽松。
anchor_min_pixels = 15

; 是否开启基于局部大笔迹密度的自适应增强。0 关闭（默认）；1 开启。
; 开启仅会在极低密度区域放宽可删除的连通域尺寸；邻近保护仍然有效。
density_enabled = 1

; 统计锚点像素密度的正方形窗口边长，必须为 3 至 501 的奇数。
; 增大：观察范围更大；减小：对局部变化更敏感。
density_window = 65

; 局部大笔迹密度低于本比例时判为稀疏区，范围 0 至 1。
; 增大：更多区域会触发增强去噪；减小：仅极稀疏区域触发。
low_density_threshold = 0.01

; 稀疏区的候选连通域最大像素数，必须不小于 max_component_pixels。
; 增大：稀疏区删除更强，数学符号误删风险更高；减小：更保守。
sparse_max_pixels = 17


[reconstruction]
; 笔迹输出模式：GRAPH=骨架图重建可独立编辑的中心线；CONTOUR=完全保留旧轮廓输出。
mode = GRAPH
; GRAPH模式选用细化算法：ZHANG_SUEN 保连通细化；MORPH 原有形态学骨架。
thinning = ZHANG_SUEN
; 是否尝试修复近距离且方向相容的断裂（独立于旧repair.enabled）。
gap_enabled = 1
; 自动连接允许的最大距离（处理后图像像素）。越大越可能跨字符误连。
max_gap = 7
; 估计端点笔迹方向时参考的路径点数。
direction_window = 6
; 平滑连接允许的最大偏转角（度）。
smooth_angle = 40
; 是否允许明显转角的短距离连接（如 Z 的两个折角）。
corner_enabled = 1
; 折角连接最大距离，建议小于 max_gap。
corner_max_gap = 3
; 折角连接允许的最大偏转角（度）。
corner_angle = 105
; 是否在已有交点处将走向相反的分支优先配对为独立路径（X 示例）。
junction_pairing = 1
; 交点两侧接续方向允许的最大偏转角（度）。
junction_angle = 40
; 输出独立路径的最低点数（至少2）。
min_points = 2
; 是否启用局部尺度约束，以减少跨字符断口连接；不是OCR字符识别。
character_guard = 1
; 修复距离占端点附近所属路径尺度的最大比例。
max_gap_ratio = 0.18
